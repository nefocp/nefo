name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go test ./...
      - name: Build and sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -n "$RELEASE_SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release.key"
            make release VERSION=${{ github.ref_name }} SIGNING_KEY="$RUNNER_TEMP/release.key"
            rm -f "$RUNNER_TEMP/release.key"
          else
            echo "::warning::RELEASE_SIGNING_KEY is not set: this release is not signed"
            make release VERSION=${{ github.ref_name }}
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
