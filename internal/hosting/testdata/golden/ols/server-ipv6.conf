# Managed by Nefo. Do not edit: the panel rewrites this file.
# OpenLiteSpeed's settings, included from conf/httpd_config.conf. The
# WebAdmin console is off: it would listen on port 7080 and change these
# files behind the panel's back.
disableWebAdmin           1
priority                  0
autoRestart               1
enableChroot              0
inMemBufSize              60M
swappingDir               /tmp/lshttpd/swap
autoFix503                1
gracefulRestartTimeout    300
mime                      conf/mime.properties
showVersionNumber         0
indexFiles                index.html

errorlog /usr/local/lsws/logs/error.log {
  logLevel                WARN
  debugLevel              0
  rollingSize             10M
  keepDays                7
  enableStderrLog         1
}

accesslog /usr/local/lsws/logs/access.log {
  rollingSize             10M
  keepDays                7
  compressArchive         1
}

tuning {
  maxConnections          10000
  maxSSLConnections       10000
  connTimeout             300
  maxKeepAliveReq         10000
  keepAliveTimeout        5
  maxReqURLLen            32768
  maxReqHeaderSize        65536
  maxReqBodySize          2047M
  maxDynRespHeaderSize    32768
  maxDynRespSize          2047M
  enableGzipCompress      1
  enableDynGzipCompress   1
  gzipCompressLevel       6
  compressibleTypes       default
  quicEnable              1
  quicShmDir              /dev/shm/ols
}

# Follow a symlink only if it has the same owner as its target, and serve
# only files of the site's own account (or root): a site (over SFTP, say)
# cannot reach another site's files.
fileAccessControl {
  followSymbolLink        2
  checkSymbolLink         1
  forceStrictOwnership    1
  requiredPermissionMask  000
  restrictedPermissionMask 000
}

accessDenyDir {
  dir                     /
  dir                     /etc/*
  dir                     /dev/*
  dir                     /root/*
  dir                     /var/lib/nefo/*
  dir                     /usr/local/lsws/conf/*
  dir                     /usr/local/lsws/admin/conf/*
  dir                     /usr/local/lsws/panel/*
}

accessControl {
  allow                   ALL
}

# The sites' Git push webhooks go to the panel's listener.
extprocessor panel_githook {
  type                    proxy
  address                 127.0.0.1:7809
  maxConns                10
  initTimeout             30
  retryTimeout            0
  respBuffer              0
}

listener http {
  address                 [ANY]:80
  secure                  0
  map                     _default *
}

listener https {
  address                 [ANY]:443
  secure                  1
  keyFile                 /usr/local/lsws/panel/default.key
  certFile                /usr/local/lsws/panel/default.crt
  sslProtocol             24
  enableQuic              1
  map                     _default *
}

# Unknown host names get no website (404). Let's Encrypt can still validate
# any name that points here, for the panel's own certificate.
virtualHost _default {
  vhRoot                  /var/lib/panel-acme/
  user                    www-data
  group                   www-data
  allowSymbolLink         0
  enableScript            0
  restrained              1
  docRoot                 /var/lib/panel-acme/
  context /.well-known/acme-challenge/ {
    location              /var/lib/panel-acme/.well-known/acme-challenge/
    allowBrowse           1
    forceType             text/plain
  }
  rewrite {
    enable                1
    autoLoadHtaccess      0
    rules                 <<<END_rules
RewriteRule ^/\.well-known/acme-challenge/ - [L]
RewriteRule ^ - [R=404,L]
END_rules
  }
}

include                   /usr/local/lsws/panel/sites/*.conf

# LiteSpeed Cache: on for the server, off for every site until its
# application asks for it (the LiteSpeed Cache plugin, or a .htaccess rule
# with E=cache-control:max-age=...).
module cache {
  ls_enabled              1
  checkPrivateCache       1
  checkPublicCache        1
  maxCacheObjSize         10000000
  maxStaleAge             200
  qsCache                 1
  reqCookieCache          1
  respCookieCache         1
  ignoreReqCacheCtrl      1
  ignoreRespCacheCtrl     0
  enableCache             0
  expireInSeconds         3600
  enablePrivateCache      0
  privateExpireInSeconds  3600
}
