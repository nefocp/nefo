# Managed by Nefo. Adminer, reachable only through the panel.
listener panel_adminer {
  address                 127.0.0.1:46000
  secure                  0
  map                     _adminer *
}

virtualHost _adminer {
  vhRoot                  /usr/share/panel-adminer/
  user                    www-data
  group                   www-data
  allowSymbolLink         0
  enableScript            1
  restrained              1
  docRoot                 /usr/share/panel-adminer/
  extprocessor adminer_php {
    type                  fcgi
    address               uds://run/php/php8.3-fpm.sock
    maxConns              5
    initTimeout           600
    retryTimeout          0
    persistConn           0
    respBuffer            0
    autoStart             0
  }
  scripthandler {
    add                   fcgi:adminer_php php
  }
  index {
    useServer             0
    indexFiles            index.php
    autoIndex             0
  }
  # Only requests with the panel's token get in.
  rewrite {
    enable                1
    autoLoadHtaccess      0
    rules                 <<<END_rules
RewriteCond %{HTTP:X-Panel-Adminer} !=0123456789abcdef0123456789abcdef
RewriteRule ^ - [R=404,L]
RewriteCond %{HTTP:Content-Length} -gt268435456
RewriteRule ^ - [R=413,L]
RewriteCond %{HTTP:X-Panel-Https} =on
RewriteRule ^ /index.php [E=HTTPS:on,L]
RewriteRule ^ /index.php [L]
END_rules
  }
}
