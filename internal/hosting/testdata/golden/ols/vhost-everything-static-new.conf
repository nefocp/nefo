# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: example.com
virtualHost example.com {
  vhRoot                  /var/www/example.com/
  vhDomain                example.com
  vhAliases               www.example.com
  listeners               http, https
  user                    example_com
  group                   example_com
  allowSymbolLink         2
  forceStrictOwnership    1
  enableScript            1
  restrained              1
  setUIDMode              0
  docRoot                 /var/www/example.com/public/
  enableGzip              1

  errorlog /var/log/openlitespeed/example.com.error.log {
    useServer             0
    logLevel              ERROR
    rollingSize           0
  }
  # Nginx's "combined" format, which the traffic statistics read.
  accesslog /var/log/openlitespeed/example.com.access.log {
    useServer             0
    logFormat             %h %l %u %t "%r" %>s %b "%{Referer}i" "%{User-Agent}i"
    rollingSize           0
  }

  vhssl {
    keyFile               /var/lib/nefo/certs/example.com/privkey.pem
    certFile              /var/lib/nefo/certs/example.com/fullchain.pem
    certChain             1
    sslProtocol           24
    enableQuic            1
  }

  module mod_security {
    ls_enabled            1
    modsecurity_rules     SecRuleEngine DetectionOnly
  }

  accessControl {
    allow                 ALL
    deny                  203.0.113.7, 2001:db8::/32
  }

  realm site {
    userDB {
      location            /usr/local/lsws/panel/auth/example.com.htpasswd
    }
  }

  index {
    useServer             0
    indexFiles            index.html, index.htm
    autoIndex             0
  }

  errorpage 404 {
    url                   /404.html
  }

  # Let's Encrypt HTTP-01 challenges, for every site.
  context /.well-known/acme-challenge/ {
    location              /var/lib/panel-acme/.well-known/acme-challenge/
    allowBrowse           1
    forceType             text/plain
  }

  context / {
    location              /var/www/example.com/public/
    allowBrowse           1
    realm                 site
    authName              Restricted
    required              valid-user
  }

  # The panel's rules: they run before the site's .htaccess rules, which
  # cannot undo them. The Git webhook and Let's Encrypt pass first.
  rewrite {
    enable                1
    autoLoadHtaccess      0
    rules                 <<<END_rules
RewriteRule ^/\.well-known/acme-challenge/ - [L]
RewriteCond %{HTTP:Content-Length} -gt1048576
RewriteRule ^/\.panel/deploy/42$ - [R=413,L]
RewriteRule ^/\.panel/deploy/42$ http://panel_githook/git/42 [P,L]
RewriteCond %{HTTP:Content-Length} -gt134217728
RewriteRule ^ - [R=413,L]
RewriteRule /\.(?!well-known/) - [F]
RewriteCond %{HTTP_REFERER} ^https?:// [NC]
RewriteCond %{HTTP_REFERER} !^https?://(?:example\.com|www\.example\.com|partner\.example\.org)(?::[0-9]+)?(?:[/?#]|$) [NC]
RewriteCond %{HTTP_REFERER} !\.(?:google|bing|duckduckgo|yahoo)\. [NC]
RewriteRule \.(?:jpe?g|png|gif|webp|avif|svg|ico|bmp|mp4|webm|mp3|ogg|pdf)$ - [F,NC]
END_rules
  }

  # Your own directives (Websites → OpenLiteSpeed configuration).
  include                 /usr/local/lsws/panel/custom/example.com.conf
}
