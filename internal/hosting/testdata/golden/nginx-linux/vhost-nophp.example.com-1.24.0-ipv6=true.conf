# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: nophp.example.com
server {
    listen 80;
    listen [::]:80;
    server_name nophp.example.com;

    include /etc/nginx/panel/acme.conf;


    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/10 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/10;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    root /var/www/nophp.example.com/public;
    # Follow a symlink only if it has the same owner as its target: a site
    # (over SFTP, say) cannot link to another site's files.
    disable_symlinks if_not_owner from=$document_root;
    index index.html index.htm;
    access_log /var/log/nginx/nophp.example.com.access.log;
    error_log /var/log/nginx/nophp.example.com.error.log;
    client_max_body_size 64m;

    # Hide .git, .env and other dot files.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
