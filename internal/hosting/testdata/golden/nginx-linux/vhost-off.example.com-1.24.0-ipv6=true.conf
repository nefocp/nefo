# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: off.example.com
server {
    listen 80;
    listen [::]:80;
    server_name off.example.com;

    include /etc/nginx/panel/acme.conf;


    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/6 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/6;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    access_log /var/log/nginx/off.example.com.access.log;
    error_log /var/log/nginx/off.example.com.error.log;

    location / {
        default_type text/plain;
        return 503 "This website is temporarily unavailable.";
    }
}
