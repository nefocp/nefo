# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: moved.example.com
server {
    listen 80;
    listen [::]:80;
    server_name moved.example.com;

    include /etc/nginx/panel/acme.conf;


    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/7 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/7;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    access_log /var/log/nginx/moved.example.com.access.log;
    error_log /var/log/nginx/moved.example.com.error.log;

    location / {
        return 301 https://example.org/new$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name moved.example.com;

    ssl_certificate     /var/lib/nefo/certs/moved.example.com/fullchain.pem;
    ssl_certificate_key /var/lib/nefo/certs/moved.example.com/privkey.pem;
    include /etc/nginx/panel/ssl.conf;


    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/7 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/7;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    access_log /var/log/nginx/moved.example.com.access.log;
    error_log /var/log/nginx/moved.example.com.error.log;

    location / {
        return 301 https://example.org/new$request_uri;
    }
}
