# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: proxy.example.com
server {
    listen 80;
    listen [::]:80;
    server_name proxy.example.com;

    include /etc/nginx/panel/acme.conf;


    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/11 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/11;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    access_log /var/log/nginx/proxy.example.com.access.log;
    error_log /var/log/nginx/proxy.example.com.error.log;
    client_max_body_size 64m;

    location / {
        proxy_pass https://10.0.0.5:8443/app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $panel_connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name proxy.example.com;

    ssl_certificate     /var/lib/nefo/certs/proxy.example.com/fullchain.pem;
    ssl_certificate_key /var/lib/nefo/certs/proxy.example.com/privkey.pem;
    include /etc/nginx/panel/ssl.conf;


    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/11 {
