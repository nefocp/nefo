# Managed by Nefo. Do not edit: the panel rewrites this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    # Let's Encrypt can validate any name that points here (for the panel's
    # own certificate); everything else gets no answer.
    include /etc/nginx/panel/acme.conf;
    location / {
        return 444;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# WebSocket support for app sites.
map $http_upgrade $panel_connection_upgrade {
    default upgrade;
    ''      close;
}

# Compression for CSS, JavaScript, JSON, SVG and fonts too: Debian and
# Ubuntu compress HTML only. What nginx.conf sets itself is left out here,
# since a directive set twice in the http block is an error.
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/ld+json application/manifest+json application/xml application/rss+xml application/atom+xml application/wasm image/svg+xml image/x-icon font/ttf font/otf application/vnd.ms-fontobject;

include /etc/nginx/panel/sites/*.conf;
