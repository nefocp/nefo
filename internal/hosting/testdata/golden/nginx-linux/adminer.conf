# Managed by Nefo. Adminer, reachable only through the panel.
server {
    listen 127.0.0.1:46000;
    server_name _;
    access_log off;
    server_tokens off;
    client_max_body_size 256m;

    if ($http_x_panel_adminer != "0123456789abcdef0123456789abcdef0123456789abcdef") {
        return 404;
    }

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share/panel-adminer/index.php;
        fastcgi_param HTTPS $http_x_panel_https if_not_empty;
        fastcgi_param HTTP_X_PANEL_ADMINER "" if_not_empty;
        fastcgi_param HTTP_X_PANEL_HTTPS "" if_not_empty;
        fastcgi_param PHP_VALUE "upload_max_filesize=256M
post_max_size=256M
max_execution_time=600
memory_limit=256M";
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 600s;
    }
}
