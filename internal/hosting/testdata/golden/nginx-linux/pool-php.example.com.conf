; Managed by Nefo. Do not edit: the panel rewrites this file.
; Site: php.example.com
[php_example_com]
user = php_example_com
group = php_example_com
listen = /run/php/panel-php_example_com.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 30s
pm.max_requests = 500

chdir = /
security.limit_extensions = .php
env[TMPDIR] = /var/www/php.example.com/tmp

php_admin_value[open_basedir] = /var/www/php.example.com/
php_admin_value[sys_temp_dir] = /var/www/php.example.com/tmp
php_admin_value[upload_tmp_dir] = /var/www/php.example.com/tmp
php_admin_value[session.save_path] = /var/www/php.example.com/tmp
php_admin_value[error_log] = /var/www/php.example.com/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
php_value[upload_max_filesize] = 64M
php_value[post_max_size] = 64M
php_value[memory_limit] = 256M
php_value[max_execution_time] = 300
