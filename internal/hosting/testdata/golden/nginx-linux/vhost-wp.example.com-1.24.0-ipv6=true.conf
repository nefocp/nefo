# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: wp.example.com
limit_req_zone $binary_remote_addr zone=panel_rl_wp_example_com:1m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name wp.example.com;

    include /etc/nginx/panel/acme.conf;

    deny 203.0.113.7;
    deny 198.51.100.0/24;
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/panel/auth/wp.example.com.htpasswd;

    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/5 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/5;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    root /var/www/wp.example.com/public;
    # Follow a symlink only if it has the same owner as its target: a site
    # (over SFTP, say) cannot link to another site's files.
    disable_symlinks if_not_owner from=$document_root;
    index index.php index.html index.htm;
    access_log /var/log/nginx/wp.example.com.access.log;
    error_log /var/log/nginx/wp.example.com.error.log;
    client_max_body_size 64m;

    # Hide .git, .env and other dot files.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Your own directives (Websites → Nginx configuration).
    include /etc/nginx/panel/custom/wp.example.com.conf;

    error_page 404 /404.html;

    # Files in uploads never run as PHP.
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Hotlink protection: media only for this site's pages, the sites listed
    # in the panel and search engines.
    location ~* \.(?:jpe?g|png|gif|webp|avif|svg|ico|bmp|mp4|webm|mp3|ogg|pdf)$ {
        valid_referers none blocked server_names partner.example.org ~\.google\. ~\.bing\. ~\.duckduckgo\. ~\.yahoo\.;
        if ($invalid_referer) {
            return 403;
        }
        try_files $uri /index.php?$args;
    }

    # PATH_INFO URLs (/index.php/page) work; only existing .php files run.
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/panel-wp_example_com.sock;
        fastcgi_read_timeout 330s;
        limit_req zone=panel_rl_wp_example_com burst=50 nodelay;
        limit_req_status 429;
    }
}
