# Managed by Nefo. Do not edit: the panel rewrites this file.
# Loaded from conf-enabled, before the sites: the defaults of every site and
# the virtual hosts for unknown host names.
ServerName localhost

# Nginx's "combined" format, which the traffic statistics read.
LogFormat "%a %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" panel_combined

# Nothing under /var/www is served unless a site's own block allows it.
<Directory /var/www/>
    Options None
    AllowOverride None
    Require all denied
</Directory>

<IfModule ssl_module>
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder off
    SSLSessionTickets off
</IfModule>
<IfModule http2_module>
    Protocols h2 http/1.1
</IfModule>

# Unknown host names get no website (404). Let's Encrypt can still validate
# any name that points here, for the panel's own certificate.
<VirtualHost *:80>
    ServerName default.invalid
    DocumentRoot /var/lib/panel-acme
    Include /etc/apache2/panel/acme.conf
    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteRule ^ - [R=404,L]
</VirtualHost>

<IfModule ssl_module>
    <VirtualHost *:443>
        ServerName default.invalid
        DocumentRoot /var/lib/panel-acme
        SSLEngine on
        SSLCertificateFile /etc/apache2/panel/default.crt
        SSLCertificateKeyFile /etc/apache2/panel/default.key
        RewriteEngine On
        RewriteRule ^ - [R=404,L]
    </VirtualHost>
</IfModule>

IncludeOptional /etc/apache2/panel/sites/*.conf
