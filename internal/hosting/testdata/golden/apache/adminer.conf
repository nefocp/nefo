# Managed by Nefo. Adminer, reachable only through the panel.
Listen 127.0.0.1:46000
<VirtualHost 127.0.0.1:46000>
    ServerName adminer.invalid
    DocumentRoot /usr/share/panel-adminer
    ProxyTimeout 600

    # Only requests with the panel's token get in; Adminer never sees it.
    RewriteEngine On
    RewriteCond %{HTTP:X-Panel-Adminer} !=0123456789abcdef0123456789abcdef
    RewriteRule ^ - [R=404,L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 268435456"
    RewriteRule ^ - [R=413,L]
    RewriteRule ^ /usr/share/panel-adminer/index.php [L]
    SetEnvIf X-Panel-Https "^on$" HTTPS=on
    RequestHeader unset X-Panel-Adminer
    RequestHeader unset X-Panel-Https

    <Directory /usr/share/panel-adminer>
        Options None
        AllowOverride None
        Require all granted
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </Directory>
</VirtualHost>
