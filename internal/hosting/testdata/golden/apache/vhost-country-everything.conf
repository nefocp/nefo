# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: example.com
<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com
    DocumentRoot /var/lib/panel-acme
    Include /etc/apache2/panel/acme.conf

    # Deploy from Git on push. The panel checks the webhook's signature.
    ProxyPass /.panel/deploy/42 http://127.0.0.1:7809/git/42 timeout=30
    <Location /.panel/deploy/42>
        ProxyPreserveHost On
        RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
        <RequireAll>
            Require all granted
            Require not ip 203.0.113.7 2001:db8::/32
        </RequireAll>
        <IfModule security2_module>
            SecRuleEngine Off
        </IfModule>
    </Location>

    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 1048576"
    RewriteRule ^/\.panel/deploy/42$ - [R=413,L]
    RewriteRule ^/\.panel/deploy/42$ - [L]

    # Everything else moves to HTTPS, with its path and query.
    RewriteCond %{THE_REQUEST} ^\S+\s+(/[^\s?]*)
    RewriteRule ^ https://%{SERVER_NAME}%1 [R=301,L,NE]
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com
    SSLEngine on
    SSLCertificateFile /var/lib/nefo/certs/example.com/fullchain.pem
    SSLCertificateKeyFile /var/lib/nefo/certs/example.com/privkey.pem

    DocumentRoot /var/www/example.com/public
    CustomLog /var/log/apache2/example.com.access.log panel_combined
    ErrorLog /var/log/apache2/example.com.error.log
    Include /etc/apache2/panel/acme.conf
    # Country blocking: behind Cloudflare's proxy, the visitor's address is
    # the one in CF-Connecting-IP (for this site's log and PHP too).
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 2400:cb00::/32 2a06:98c0::/29
    <IfModule security2_module>
        SecRuleEngine DetectionOnly
    </IfModule>

    # The panel's rules: Apache applies them after the site's .htaccess
    # files, which cannot undo them.
    <Location />
        # PHP requests reach this site's own PHP-FPM pool only, and without
        # PHP settings from .htaccess (SetEnv PHP_VALUE…).
        ProxyFCGISetEnvIf "note('uds_path') != '/run/php/panel-example_com.sock'" SCRIPT_FILENAME /nonexistent
        ProxyFCGISetEnvIf "true" !PHP_VALUE
        ProxyFCGISetEnvIf "true" !PHP_ADMIN_VALUE
        AuthType Basic
        AuthName "Restricted"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/panel/auth/example.com.htpasswd
        AuthMerging And
        Satisfy All
        <RequireAll>
            Require valid-user
            Require not ip 203.0.113.7 2001:db8::/32
            # Country blocking: only these countries get in.
            <RequireAny>
                Require local
                Include /etc/apache2/panel/geo/VN.conf
                Include /etc/apache2/panel/geo/ZZ.conf
            </RequireAny>
        </RequireAll>
    </Location>

    # Hide .git, .env and other dot files.
    <LocationMatch "/\.(?!well-known/)">
        Require all denied
    </LocationMatch>

    # Let's Encrypt validates without the password and from any country.
    <Location /.well-known/acme-challenge/>
        <RequireAll>
            Require all granted
            Require not ip 203.0.113.7 2001:db8::/32
        </RequireAll>
    </Location>

    # Blocked visitors may load the site's own error page.
    <Location /403.html>
        <RequireAll>
            Require all granted
            Require not ip 203.0.113.7 2001:db8::/32
        </RequireAll>
    </Location>

    # Deploy from Git on push. The panel checks the webhook's signature.
    ProxyPass /.panel/deploy/42 http://127.0.0.1:7809/git/42 timeout=30
    <Location /.panel/deploy/42>
        ProxyPreserveHost On
        RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
        <RequireAll>
            Require all granted
            Require not ip 203.0.113.7 2001:db8::/32
        </RequireAll>
        <IfModule security2_module>
            SecRuleEngine Off
        </IfModule>
    </Location>

    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 1048576"
    RewriteRule ^/\.panel/deploy/42$ - [R=413,L]
    RewriteRule ^/\.panel/deploy/42$ - [L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 134217728"
    RewriteRule ^ - [R=413,L]

    # Files in uploads never run as PHP.
    RewriteRule ^/wp-content/uploads/.*\.php$ - [F,NC]

    # Hotlink protection: media only for this site's pages, the sites listed
    # in the panel and search engines.
    RewriteCond %{HTTP_REFERER} ^https?:// [NC]
    RewriteCond %{HTTP_REFERER} !^https?://(?:example\.com|www\.example\.com|partner\.example\.org)(?::[0-9]+)?(?:[/?#]|$) [NC]
    RewriteCond %{HTTP_REFERER} !\.(?:google|bing|duckduckgo|yahoo)\. [NC]
    RewriteRule \.(?:jpe?g|png|gif|webp|avif|svg|ico|bmp|mp4|webm|mp3|ogg|pdf)$ - [F,NC]

    <Directory /var/www/example.com/public>
        # Follow a symlink only if it has the same owner as its target: a
        # site (over SFTP, say) cannot link to another site's files. The
        # site's .htaccess files work, but cannot change Options; lines they
        # may not use, and unknown ones such as php_value, are ignored
        # (logged in the error log) instead of breaking the site.
        Options SymLinksIfOwnerMatch
        AllowOverride AuthConfig FileInfo Indexes Limit Nonfatal=All
        Require all granted
        DirectoryIndex index.php index.html index.htm
        # Only .php files run: /uploads/a.jpg/x.php is a.jpg, never PHP.
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/panel-example_com.sock|fcgi://localhost"
        </FilesMatch>
        FallbackResource /index.php
    </Directory>
    ProxyTimeout 90
    ErrorDocument 404 /404.html

    # Your own directives (Websites → Apache configuration).
    Include /etc/apache2/panel/custom/example.com.conf
</VirtualHost>
