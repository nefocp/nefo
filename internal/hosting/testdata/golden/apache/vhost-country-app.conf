# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: example.com
<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com

    DocumentRoot /var/lib/panel-acme
    CustomLog /var/log/apache2/example.com.access.log panel_combined
    ErrorLog /var/log/apache2/example.com.error.log
    Include /etc/apache2/panel/acme.conf
    # Country blocking: behind Cloudflare's proxy, the visitor's address is
    # the one in CF-Connecting-IP (for this site's log and PHP too).
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 2400:cb00::/32 2a06:98c0::/29

    # The panel's rules: Apache applies them after the site's .htaccess
    # files, which cannot undo them.
    <Location />
        # PHP requests reach this site's own PHP-FPM pool only, and without
        # PHP settings from .htaccess (SetEnv PHP_VALUE…).
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME /nonexistent
        ProxyFCGISetEnvIf "true" !PHP_VALUE
        ProxyFCGISetEnvIf "true" !PHP_ADMIN_VALUE
        AuthMerging And
        Satisfy All
        <RequireAll>
            Require all granted
            # Country blocking: these countries are refused.
            <RequireNone>
                <RequireAll>
                    Require not local
                    <RequireAny>
                        Include /etc/apache2/panel/geo/CN.conf
                    </RequireAny>
                </RequireAll>
            </RequireNone>
        </RequireAll>
    </Location>

    # Let's Encrypt validates from any country.
    <Location /.well-known/acme-challenge/>
        Require all granted
    </Location>

    # Blocked visitors may load the site's own error page.
    <Location /403.html>
        Require all granted
    </Location>

    # Deploy from Git on push. The panel checks the webhook's signature.
    ProxyPass /.panel/deploy/42 http://127.0.0.1:7809/git/42 timeout=30
    <Location /.panel/deploy/42>
        ProxyPreserveHost On
        RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
        Require all granted
    </Location>

    RewriteEngine On
    RewriteRule ^/\.well-known/acme-challenge/ - [L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 1048576"
    RewriteRule ^/\.panel/deploy/42$ - [R=413,L]
    RewriteRule ^/\.panel/deploy/42$ - [L]
    RewriteCond expr "%{HTTP:Content-Length} -gt 67108864"
    RewriteRule ^ - [R=413,L]

    ProxyPreserveHost On
    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:3000/ upgrade=websocket timeout=300
    ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
