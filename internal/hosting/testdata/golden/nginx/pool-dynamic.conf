; Managed by Nefo. Do not edit: the panel rewrites this file.
; Site: example.com
[example_com]
user = example_com
group = example_com
listen = /run/php/panel-example_com.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 6
pm.max_requests = 500

chdir = /
security.limit_extensions = .php
env[TMPDIR] = /var/www/example.com/tmp

php_admin_value[open_basedir] = /var/www/example.com/
php_admin_value[sys_temp_dir] = /var/www/example.com/tmp
php_admin_value[upload_tmp_dir] = /var/www/example.com/tmp
php_admin_value[session.save_path] = /var/www/example.com/tmp
php_admin_value[error_log] = /var/www/example.com/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_value[disable_functions] = passthru,shell_exec,system,popen,pcntl_exec
php_value[upload_max_filesize] = 64M
php_value[post_max_size] = 64M
php_value[memory_limit] = 256M
php_value[max_execution_time] = 300
