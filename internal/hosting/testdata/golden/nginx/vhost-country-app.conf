# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: example.com
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    include /etc/nginx/panel/acme.conf;

    # Country blocking (Websites → Country blocking). Let's Encrypt, the Git
    # webhook and /403.html stay reachable.
    set $panel_geo_deny 0;
    if ($panel_country ~ "^(?:CN)$") {
        set $panel_geo_deny 1;
    }
    if ($uri ~ "^/(?:\.well-known/acme-challenge/|\.panel/deploy/|403\.html$)") {
        set $panel_geo_deny 0;
    }
    if ($panel_geo_deny) {
        return 403;
    }

    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/42 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/42;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log;
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $panel_connection_upgrade;
        proxy_read_timeout 300s;
    }
}
