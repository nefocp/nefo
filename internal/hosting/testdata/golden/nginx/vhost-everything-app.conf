# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: example.com
limit_req_zone $binary_remote_addr zone=panel_rl_example_com:1m rate=20r/s;
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    include /etc/nginx/panel/acme.conf;

    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/42 {
        auth_basic off;
        modsecurity off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/42;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /var/lib/nefo/certs/example.com/fullchain.pem;
    ssl_certificate_key /var/lib/nefo/certs/example.com/privkey.pem;
    include /etc/nginx/panel/ssl.conf;

    deny 203.0.113.7;
    deny 2001:db8::/32;
    modsecurity on;
    modsecurity_rules 'SecRuleEngine DetectionOnly';
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/panel/auth/example.com.htpasswd;

    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/42 {
        auth_basic off;
        modsecurity off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/42;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log;
    client_max_body_size 128m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $panel_connection_upgrade;
        proxy_read_timeout 300s;
        limit_req zone=panel_rl_example_com burst=100 nodelay;
        limit_req_status 429;
    }

    # Your own directives (Websites → Nginx configuration).
    include /etc/nginx/panel/custom/example.com.conf;
}
