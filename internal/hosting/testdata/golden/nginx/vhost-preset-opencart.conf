# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: example.com
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    include /etc/nginx/panel/acme.conf;


    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/42 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/42;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    root /var/www/example.com/public;
    # Follow a symlink only if it has the same owner as its target: a site
    # (over SFTP, say) cannot link to another site's files.
    disable_symlinks if_not_owner from=$document_root;
    index index.php index.html index.htm;
    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log;
    client_max_body_size 64m;

    # Hide .git, .env and other dot files.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        try_files $uri $uri/ @opencart;
    }

    location @opencart {
        rewrite ^/(.+)$ /index.php?_route_=$1 last;
    }

    # Templates, settings and logs are never served.
    location ~* \.(twig|tpl|ini|log)$ {
        deny all;
    }

    # PATH_INFO URLs (/index.php/page) work; only existing .php files run.
    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/panel-example_com.sock;
        fastcgi_read_timeout 300s;
    }
}
