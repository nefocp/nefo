# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: example.com
# Page cache of this site's PHP pages: purging empties the folder.
fastcgi_cache_path /var/cache/nginx/nefo/example.com levels=1:2 keys_zone=panel_fc_example_com:4m max_size=256m inactive=60m use_temp_path=off;
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    include /etc/nginx/panel/acme.conf;


    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/42 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/42;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log;

    location / {
        default_type text/plain;
        return 503 "This website is temporarily unavailable.";
    }
}
