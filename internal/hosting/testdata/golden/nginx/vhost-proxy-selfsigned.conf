# Managed by Nefo. Do not edit: the panel rewrites this file.
# Site: example.com
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    include /etc/nginx/panel/acme.conf;


    # Deploy from Git on push. The panel checks the webhook's signature.
    location = /.panel/deploy/42 {
        auth_basic off;
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:7809/git/42;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    access_log /var/log/nginx/example.com.access.log;
    error_log /var/log/nginx/example.com.error.log;
    client_max_body_size 64m;

    location / {
        proxy_pass https://192.168.1.20:8443$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_ssl_server_name on;
        proxy_ssl_name $host;
        # The upstream's certificate is not checked (Websites → Reverse proxy).
        proxy_ssl_verify off;
    }
}
